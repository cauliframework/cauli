# Temporary: renders the main screens in light and dark mode, before and after the
# dark mode changes, and commits them to this branch.
name: Screenshots

on:
  push:
    branches: ['tmp/dark-mode-screenshots']

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - name: Take screenshots
        run: |
          IPHONE="$(.github/scripts/simulator-destination.sh iPhone)"
          IPAD="$(.github/scripts/simulator-destination.sh iPad)"
          shoot() {
            mkdir -p "screenshots/$1"
            TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots/$1" xcodebuild test \
              -scheme Cauliframework \
              -destination "${IPHONE}" \
              -destination "${IPAD}" \
              -only-testing:CauliframeworkTests/ScreenshotTests \
              -skipPackagePluginValidation -quiet
          }
          shoot after
          git checkout origin/develop -- Cauli
          shoot before
          git checkout HEAD -- Cauli
          ls -R screenshots
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git commit -m "Added screenshots"
          git push
