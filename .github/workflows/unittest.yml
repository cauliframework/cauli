name: Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Test (Xcode ${{ matrix.xcode }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: "16.4"
          - runner: macos-26
            xcode: "latest-stable"
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Run unit tests
        run: |
          IPHONE="$(.github/scripts/simulator-destination.sh iPhone)"
          IPAD="$(.github/scripts/simulator-destination.sh iPad)"
          echo "Testing on ${IPHONE} and ${IPAD}"
          xcodebuild test \
            -scheme Cauliframework \
            -destination "${IPHONE}" \
            -destination "${IPAD}" \
            -configuration Debug \
            -skipPackagePluginValidation

  build-example-app:
    name: Build Example App
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - name: Build example app
        run: |
          xcodebuild build \
            -project Example/cauli-ios-example/cauli-ios-example.xcodeproj \
            -scheme cauli-ios-example \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

  lint-podspec:
    name: Lint Podspec
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - name: Install CocoaPods
        run: command -v pod || sudo gem install cocoapods
      - name: Lint podspec
        run: pod lib lint Cauliframework.podspec --allow-warnings

  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.57.0
    steps:
      - uses: actions/checkout@v5
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging
